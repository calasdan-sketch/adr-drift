[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adr-drift"
dynamic = ["version"]
description = "Deterministic architecture tests: keep the codebase honest about its own ADRs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Calas Automations Inc." }]
keywords = ["adr", "architecture", "architecture-decision-records", "architecture-tests", "ci", "lint", "dependencies", "imports"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/calasdan-sketch/adr-drift"
Source = "https://github.com/calasdan-sketch/adr-drift"
Changelog = "https://github.com/calasdan-sketch/adr-drift/blob/main/CHANGELOG.md"
Issues = "https://github.com/calasdan-sketch/adr-drift/issues"

[project.scripts]
adr-drift = "adr_drift.cli:main"

[tool.setuptools]
packages = ["adr_drift"]

[tool.setuptools.dynamic]
version = { attr = "adr_drift.__version__" }
