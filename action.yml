name: adr-drift
description: Fail the job when code drifts from arch.yaml and ADR constraints.
inputs:
  args:
    description: Extra arguments for `adr-drift check` (e.g. --adr-dir doc/adr, --root packages/api, --baseline .adr-baseline.json, --strict, --allow-empty). Split on spaces, no quoting.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ADR_DRIFT_ARGS: ${{ inputs.args }}
      run: python -m pip install --quiet "$GITHUB_ACTION_PATH" && python -m adr_drift check $ADR_DRIFT_ARGS
