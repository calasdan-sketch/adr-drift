name: adr-drift
description: Fail the job when code drifts from arch.yaml and ADR constraints.
inputs:
  args:
    description: Extra arguments for `adr-drift check` (e.g. --format github, --adr-dir doc/adr, --root packages/api, --baseline .adr-baseline.json, --strict, --allow-empty). Split on whitespace (spaces and newlines); no quoting and no wildcard expansion, so a path with a space in it cannot be passed.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ADR_DRIFT_ARGS: ${{ inputs.args }}
      run: bash "$GITHUB_ACTION_PATH/action.sh"
